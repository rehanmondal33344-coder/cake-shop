name: Automated Cake Shop Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: |
          cd sweetcrust
          npm install

      - name: Compile React Application Production Build
        run: |
          cd sweetcrust
          npm run build

      - name: Deploy Compiled Files to Apache Web Server
        run: |
          # Clear old production deployment
          sudo rm -rf /var/www/html/*
          # Copy fresh production compilation files
          sudo cp -r sweetcrust/dist/* /var/www/html/
          # Readjust Apache access permissions
          sudo chown -R www-data:www-data /var/www/html/
          sudo chmod -R 755 /var/www/html/
